<div class="all">
  <div class="video-container">
    <video
      #videoElement
      id="video"
      autoplay
      preload="auto"
      disablePictureInPicture
      (ended)="playNextVideo()"
    ></video>
  </div>
  <div class="overlay" *ngIf="showOverlay || !videos.length">
    <div class="inside-overlay">
      <div class="buttons">
        <button (click)="selectVideos()">Import</button>
        <button (click)="playAll()">Play All</button>
        <button
          *ngIf="videos.length"
          class="delete-all"
          [class.armed]="deleteArmed"
          (click)="deleteAll()"
        >
          {{ deleteArmed ? 'Tap again to delete all (5s)' : 'Delete All' }}
        </button>
      </div>
      <div class="file-count">
        <p *ngIf="selectedFileCount != 0">
          {{ selectedFileCount }} Selected Files
        </p>
        <p *ngIf="!videos.length" class="empty">No videos imported</p>
        <p class="hint">Esc or double-click hides this menu</p>
      </div>
      <input
        type="file"
        id="fileInput"
        (change)="handleFileInput($event)"
        multiple
      />
    </div>
  </div>
</div>
